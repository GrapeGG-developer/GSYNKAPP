name: Build GSYNK-AI exe (Windows)

on:
  push:
    tags:
      - "gsynk-AI-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, куда приложить exe"
        required: true
        default: "gsynk-AI-v1.0.3"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy PySide6-Essentials psutil pyinstaller
          # DirectML включает видеокарты AMD/Intel под Windows. Если пакет не встанет —
          # exe всё равно соберётся и будет учить на процессоре на 100%.
          pip install torch-directml==0.2.5.dev240914
          if ($LASTEXITCODE -ne 0) { Write-Host "torch-directml не установился, продолжаем без него" }

      - name: Sanity check imports
        shell: pwsh
        working-directory: windows/GSYNK-AI
        run: |
          python -c "import torch, numpy, PySide6; print('torch', torch.__version__)"
          python -c "import gsai.dataset, gsai.model, gsai.trainer, gsai.package, gsai.server, gsai.updater; print('gsai core OK')"

      - name: Build exe with PyInstaller (onedir)
        shell: pwsh
        working-directory: windows/GSYNK-AI
        run: |
          $extra = ""
          python -c "import torch_directml" 2>$null
          if ($LASTEXITCODE -eq 0) { $extra = "--collect-all torch_directml" ; Write-Host "DirectML найден, включаю в сборку" }
          pyinstaller --noconfirm --onedir --windowed --name GSYNK-AI --icon icon.ico --collect-submodules gsai $extra app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller упал" }
          Get-ChildItem dist\GSYNK-AI | Select-Object -First 20

      - name: Smoke test exe
        shell: pwsh
        working-directory: windows/GSYNK-AI
        run: |
          $p = Start-Process -FilePath "dist\GSYNK-AI\GSYNK-AI.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "GSYNK-AI.exe завершился сам с кодом $($p.ExitCode)" }
          Write-Host "GSYNK-AI.exe жив через 15 секунд, останавливаю"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Pack zip
        shell: pwsh
        working-directory: windows/GSYNK-AI
        run: |
          Compress-Archive -Path dist\GSYNK-AI -DestinationPath GSYNK-AI-win64.zip -Force
          Get-Item GSYNK-AI-win64.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSYNK-AI-win64
          path: windows/GSYNK-AI/GSYNK-AI-win64.zip

      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          Write-Host "Целевой релиз: $tag"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title "GSYNK-AI для Windows" --notes "Автоматическая сборка GSYNK-AI.exe (GitHub Actions)."
          }
          gh release upload $tag "windows/GSYNK-AI/GSYNK-AI-win64.zip" --clobber
