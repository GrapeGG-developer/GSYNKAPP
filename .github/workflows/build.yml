name: Проверка и сборка

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # без пакета 'tools': он исключён из репозитория Google и ломает установку
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}

      - name: Тесты и Lint
        run: bash gradlew testDebugUnitTest lintDebug --no-daemon --console=plain

      - name: Сборка APK
        run: bash gradlew assembleDebug --no-daemon --console=plain

      - name: Переименовать APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/GSYNK-${GITHUB_REF_NAME}-ci.apk"

      # APK не прикрепляется к релизу намеренно: сборка на сервере подписывается
      # другим debug-ключом, и обновление «поверх» установленного приложения не встанет
      # (Android требует совпадения подписи). В релизы кладём APK, собранный локально.
      - name: Сохранить APK как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: GSYNK-apk-ci
          path: release/*.apk
