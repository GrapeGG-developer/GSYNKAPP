name: Сборка APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}

      - name: Тесты и Lint
        run: bash gradlew testDebugUnitTest lintDebug --no-daemon --console=plain

      - name: Сборка APK
        run: bash gradlew assembleDebug --no-daemon --console=plain

      - name: Переименовать APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/GSYNK-${GITHUB_REF_NAME}-debug.apk"

      - name: Прикрепить APK к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk

      - name: Сохранить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: GSYNK-apk
          path: release/*.apk
